<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa</title>
    <style>
        body{
            background-color: rgb(118, 137, 223);
            color: white;
            font-family: Arial, Helvetica, sans-serif;/* Comentário em CSS*/
            
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> <!-- Comentário em HTML-->
    <p>Já me livrei da maldição.</p>

    <script>
        var n1 = Number(window.prompt('Digite um número: ')) //String
        var n2 = Number(window.prompt('Digite outro número: ')) //String
        var s = n1 + n2 
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
        /* (string + string) para Concatenação*/ 
        /* (number + number) para Soma*/
    </script>
</body>
</html>
