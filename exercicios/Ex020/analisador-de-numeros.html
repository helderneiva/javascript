<main>
    <section>
        <h2 id="titpainel">Painel</h2>
        
        <form id="for">

            <select name="flista" id="flista" size="6"></select>
            
            <button type="button" id="finalizar">Finalizar</button>
        </form>
        
        <output id="res">
            <p>O resultado aparecerá aqui.</p>
        </output>
    </section>
</main>
