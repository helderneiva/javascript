<!DOCTYPE html>
<html lang="pt-BT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Supermercado</title>
</head>
<body>
    <header>
        <h1>App Lista de Compras</h1>
    </header>
    
    <main class="container-principal">
        <section class="lista-cadastro">
            <input type="text" name="nome_produto" placeholder="Nome do Produto...">
            <input type="number" name="valor_produto" placeholder="Valor do Produto...">
            <input type="submit" name="acao" value="Cadastrar">
        </section>
        
        <section class = lista-produto>
        
        </section>
        
        <section class="soma">
            <h2>Total: <output id="valor-total">R$ 0,00</output></h2>
        </section>
        
        <div class="acao">
            <button name="limpar" class="btn-limpar">Limpar</button>
        </div>
    </main>
    

    <script src="supermercado.js"></script>
</body>
</html>
